name: Deploy Office Plus to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Create public Supabase configuration
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/generate-config.mjs
      - name: Check site assets
        run: node scripts/check-repo.mjs
      - name: Test job data and workbook tools
        run: |
          node scripts/test-job-data.mjs
          node scripts/test-workbook.mjs
      - name: Test Supabase API compatibility
        run: node scripts/test-bridge-mock.mjs
      - name: Test Office Simulator stability
        run: |
          node scripts/test-walking-routes.cjs
          node scripts/test-movement-timeline.mjs
          node scripts/test-living-timeline-sync.mjs
          node scripts/test-3d-interactions.mjs
          node scripts/test-v86-16-simulation-rebuild.mjs
          node scripts/test-v86-18-office-seating.mjs
      - name: Stamp current build version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/stamp-version.mjs
      - name: Disable Jekyll transformations
        run: touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
